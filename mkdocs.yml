site_name: Apiary
site_description: Task-driven agent orchestration harness
repo_url: https://github.com/orlandoburli/apiary
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo.svg
  favicon: icon.svg
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Apiary Guide: apiary-guide.md
  - Dashboard: dashboard.md
  - GitHub Source: github-source.md
  - Development: development.md

extra:
  generator: false
