site_name: Apiary
site_description: Task-driven agent orchestration harness
repo_url: https://github.com/orlandoburli/apiary
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo.svg
  favicon: icon.svg
  palette:
    scheme: default
    primary: white
    accent: indigo
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guide:
      - Concepts: concepts.md
      - Configuration: configuration.md
      - Runners: runners.md
      - Workflows: workflows.md
      - Tasks & Fan-out: tasks-and-fanout.md
      - Agent Memory: memory.md
      - Rate Limits & Resilience: resilience.md
      - Distributed Workers: distributed-workers.md
  - Sources:
      - Supported Integrations: supported-integrations.md
      - GitHub: github-source.md
      - Jira: jira-source.md
      - Plane: plane-source.md
      - Prometheus: prometheus-source.md
      - Dynatrace: dynatrace-source.md
  - Reference:
      - CLI: cli.md
      - Dashboard: dashboard.md
      - VS Code Extension: vscode-extension.md
      - Data Model: data-model.md
  - Development: development.md
  - License: license.md

extra:
  generator: false
