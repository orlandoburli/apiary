version: "1.0"

runners:
  - id: claude-cli
    type: cli
    config:
      command: claude
      model_flag: --model
      prompt_flag: --input-text
      turns_flag: --turns

default_runner: claude-cli

sources:
  - id: project-erp
    type: plane
    config:
      workspace_id: ${PLANE_WORKSPACE_ID}
      project_id: ${PLANE_PROJECT_ID}
      api_token: ${PLANE_API_TOKEN}
    poll_interval: 60s
    filters:
      states: [backlog, todo]

agents:
  - id: engineer
    description: Senior software engineer — backend and API design
    soul_file: .apiary/souls/engineer.md
    model: claude-sonnet-4-6
    skills: [backend-api, error-handling, database]
    runner: claude-cli

  - id: reviewer
    description: Code reviewer — quality assurance and best practices
    soul_file: .apiary/souls/reviewer.md
    model: claude-sonnet-4-6
    skills: [code-review, testing]
    runner: claude-cli

routes:
  - id: engineer-work
    priority: 10
    match:
      source: project-erp
      labels: [agent:engineer]
    agent: engineer
    on_complete:
      set_state: in review

  - id: review-work
    priority: 20
    match:
      source: project-erp
      labels: [agent:reviewer]
    agent: reviewer
    on_complete:
      set_state: done

settings:
  concurrency: 4
  log_level: info
  state_lock: true
  result_comment: true

