version: "1"

runners:
  - id: claude-cli
    type: cli
    provider: claude

default_runner: claude-cli

sources:
  - id: project-erp
    type: plane
    config:
      workspace: my-workspace
      project: ${PLANE_PROJECT_ID}
      api_key: ${PLANE_API_KEY}
      base_url: https://plane.example.com
    poll_interval: 60s
    filters:
      states: [backlog, todo]

agents:
  - id: engineer
    description: Senior software engineer — backend and API design
    soul_file: .apiary/souls/engineer.md
    model: claude-sonnet-4-6
    # Each name must exist on disk as <root>/.apiary/skills/<name>/SKILL.md
    # (.claude/skills and .opencode/skills are searched too, plus the same
    # directories under $HOME). `apiary validate` fails on a name it cannot
    # find, so this example ships the declaration commented out:
    # skills: [backend-api, error-handling, database]
    runner: claude-cli

  - id: reviewer
    description: Code reviewer — quality assurance and best practices
    soul_file: .apiary/souls/reviewer.md
    model: claude-sonnet-4-6
    # skills: [code-review, testing]   # see the note on the engineer agent above
    runner: claude-cli

workflows:
  - id: engineer-work
    trigger:
      priority: 10
      match:
        source: project-erp
        labels: [agent:engineer]
    steps:
      - id: run
        agent: engineer
    on_complete:
      set_state: in review

  - id: review-work
    trigger:
      priority: 20
      match:
        source: project-erp
        labels: [agent:reviewer]
    steps:
      - id: run
        agent: reviewer
    on_complete:
      set_state: done

settings:
  concurrency: 4
  log_level: info
  state_lock: true

