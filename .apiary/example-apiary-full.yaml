version: "1"

# ── Runners ────────────────────────────────────────────────────────────────────
# Define how agents will execute (CLI, API, custom gateway, etc.)
runners:
  # Claude CLI runner (local development, no API keys needed)
  - id: claude
    type: cli
    provider: claude
    config:
      args: ["--output-format", "stream-json", "--verbose"]

  # Claude API runner (Anthropic API with full model access) — requires provider
  - id: claude-api
    type: cli
    provider: anthropic
    config:
      provider: anthropic
      base_url: https://api.anthropic.com/v1
      api_key: ${ANTHROPIC_API_KEY}
      # Optional: model name mappings if needed
      # models:
      #   claude-opus-4-8: claude-4-20250514
      #   claude-sonnet-4-6: claude-3-5-sonnet-20241022

  # ── OpenCode runners ────────────────────────────────────────────────────────
  # OpenCode has two subscription tiers (Go and Zen), each available in two
  # execution modes (CLI and API). Choose the combination that fits your setup.
  #
  #   CLI mode:   invokes the opencode binary as a subprocess.
  #               Requires opencode installed on the host.
  #
  #   API mode:   calls the opencode HTTP API directly.
  #               Requires an API key from the respective subscription.
  #
  # OpenCode Go — CLI mode (uses the local opencode binary with Go subscription)
  - id: opencode-go-cli
    type: cli
    provider: opencode
    config:
      mode: cli
      subscription: go
      binary: opencode
      agent: backend-dev
      model_flag: --model
      prompt_flag: --prompt
      turns_flag: --max-turns
      agent_flag: --agent

  # OpenCode Go — API mode (calls the Go API directly)
  - id: opencode-go-api
    type: opencode-api
    config:
      subscription: go
      api_key: ${OPENCODE_GO_API_KEY}
    models:
      - opencode-go/deepseek-v4-pro
      - opencode-go/minimax-m3

  # OpenCode Zen — CLI mode (uses the local opencode binary with Zen subscription)
  - id: opencode-zen-cli
    type: cli
    provider: opencode
    config:
      binary: opencode

  # OpenCode Zen — API mode (calls the Zen API directly)
  - id: opencode-zen-api
    type: opencode-api
    config:
      subscription: zen
      api_key: ${OPENCODE_ZEN_API_KEY}

# Default runner used by agents if not overridden
default_runner: claude-cli

# ── Sources ────────────────────────────────────────────────────────────────────
sources:
  - id: project-erp
    type: plane
    config:
      workspace: project-erp
      project: 6ee18c57-7f88-414c-bad5-44ef4afd979b
      api_key: ${PLANE_API_KEY}
      base_url: http://localhost:8091
    poll_interval: 60s
    filters:
      states: [backlog, todo, in progress]

  - id: my-repo
    type: github
    config:
      repo: my-org/my-repo
      # GitHub personal access token. Required for private repos.
      #
      # Classic PAT: scope `repo` (full control).
      # Fine-grained PAT: `Issues` → Read & Write, `Metadata` → Read.
      #
      # Without a token: 60 req/h (public repos only).
      api_key: ${GITHUB_TOKEN}
      # base_url: https://api.github.com  # optional for GHES
    poll_interval: 120s
    filters:
      states: [open]
      labels: [ai-ready]

# ── Agents ─────────────────────────────────────────────────────────────────────
agents:
  # === Claude-based agents (original design) ===

  - id: investigator
    description: "Investigator — analyzes and classifies tasks by complexity"
    soul_file: .apiary/souls/investigator.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, changelog-contexto]

  - id: po
    description: "Product Owner — transforms business demands into specifications"
    soul_file: .apiary/souls/po.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, changelog-contexto, delegate-to-agent]

  - id: staff
    description: "Staff Engineer — designs complex solutions and decomposes tasks"
    soul_file: .apiary/souls/staff.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, git-workflow, changelog-contexto]

  - id: engineer
    description: "Engineer — implements tasks following project conventions"
    soul_file: .apiary/souls/engineer.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [git-workflow, e2e-before-pr, gitnexus-codebase, handler-error-logging, changelog-contexto]

  - id: reviewer
    description: "Reviewer — performs code review and quality checks"
    soul_file: .apiary/souls/reviewer.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [git-workflow, gitnexus-codebase, e2e-before-pr]
    # Per-agent source token and git identity. When set, write operations
    # (comments, labels, state changes) use this GitHub account, and commits
    # use these author details — each agent acts as its own identity.
    source_token: ${GITHUB_TOKEN_REVIEWER}
    source_email: reviewer@company.com
    source_name: Reviewer Bot

  - id: qa
    description: "QA — validates implementation against acceptance criteria"
    soul_file: .apiary/souls/qa.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [e2e-before-pr, changelog-contexto]
    source_token: ${GITHUB_TOKEN_QA}
    source_email: qa@company.com

  # === OpenCode-based agents ===
  - id: agent-go-cli
    description: "OpenCode Go — runs tasks via the opencode CLI"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-go-cli
    model: opencode-go/deepseek-v4-flash
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-go-api
    description: "OpenCode Go — runs tasks via the Go API"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-go-api
    model: opencode-go/deepseek-v4-pro
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-zen-cli
    description: "OpenCode Zen — runs tasks via the opencode CLI"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-zen-cli
    model: opencode/gpt-5.5
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-zen-api
    description: "OpenCode Zen — runs tasks via the Zen API"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-zen-api
    model: opencode/gpt-5.4
    skills: [git-workflow, gitnexus-codebase]

# ── Workflows ──────────────────────────────────────────────────────────────────
# Single-agent workflows (formerly `routes:`) — each matches on the agent: label.
workflows:
  - id: complex-design
    trigger:
      priority: 10
      match:
        source: project-erp
        labels: [agent:staff]
    steps:
      - id: run
        agent: staff
    on_complete:
      set_state: in review

  - id: requirements-spec
    trigger:
      priority: 15
      match:
        source: project-erp
        labels: [agent:po]
    steps:
      - id: run
        agent: po
    on_complete:
      set_state: in review

  - id: engineer-implement
    trigger:
      priority: 20
      match:
        source: project-erp
        labels: [agent:engineer]
    steps:
      - id: run
        agent: engineer
    on_complete:
      set_state: in review

  - id: code-review
    trigger:
      priority: 25
      match:
        source: project-erp
        labels: [agent:reviewer]
    steps:
      - id: run
        agent: reviewer
    on_complete:
      set_state: in review

  - id: qa-validate
    trigger:
      priority: 30
      match:
        source: project-erp
        labels: [agent:qa]
    steps:
      - id: run
        agent: qa
    on_complete:
      set_state: done

  # Triage — classify a new issue and route it to the right agent in one instance.
  - id: triage
    description: "Classify a new issue and route it to the right agent in one instance."
    resume: allowed
    trigger:
      priority: 100
      match:
        source: project-erp
        states: [todo]
        exclude_label_prefix: "agent:"

    steps:
      - id: classify
        agent: investigator
        summary_prompt: "One line: which agent you chose and the key reason."
        output_schema:
          type: object
          properties:
            agent: {type: string, enum: [po, staff, engineer, reviewer, qa]}
          required: [agent]
        memory:
          write: [agent]

      - id: route
        type: split
        branches:
          - if: 'memory.agent == "po"'
            goto: spec
          - if: 'memory.agent == "staff"'
            goto: design
          - if: 'memory.agent == "reviewer"'
            goto: review
          - if: 'memory.agent == "qa"'
            goto: validate
          - else: true
            goto: implement

      - id: spec
        agent: po
        prompt: "Produce the spec / acceptance criteria for this issue."

      - id: design
        agent: staff
        prompt: "Design the solution and decompose it into smaller tasks."

      - id: implement
        agent: engineer
        prompt: "Implement the change following project conventions."

      - id: review
        agent: reviewer
        prompt: "Review the change for correctness and conventions."

      - id: validate
        agent: qa
        prompt: "Validate the implementation against its acceptance criteria."

    on_complete:
      set_state: done
    on_fail:
      add_labels: [needs-attention]


# ── Settings ───────────────────────────────────────────────────────────────────
settings:
  concurrency: 2
  log_level: info
  state_lock: true
  result_comment: true
