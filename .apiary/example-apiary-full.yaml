version: "1"

# ── Runners ────────────────────────────────────────────────────────────────────
# Define how agents will execute. The adapter is resolved as "{provider}-{type}"
# (or just "type" when provider is empty). Registered adapters:
#
#   claude-cli    →  type: cli, provider: claude    (the `claude` binary)
#   opencode-cli  →  type: cli, provider: opencode  (the `opencode` binary)
#   codex-cli     →  type: cli, provider: codex     (the `codex` binary)
#   cursor-cli    →  type: cli, provider: cursor    (the `agent` binary, Cursor CLI)
#   opencode-api  →  type: opencode-api             (OpenCode HTTP API)
#
# Any other combination fails at daemon startup with "runner type not found".
# See docs/runners.md for the full reference.
runners:
  # Claude CLI runner (local development, no API keys needed). The preset runs
  # `claude --output-format stream-json --verbose` so Apiary can parse usage,
  # results, and rate-limit events; no config needed.
  - id: claude-cli
    type: cli
    provider: claude
    # Model Context Protocol servers exposed to every agent on this runner.
    # Each provider writes them into its own native MCP config: claude uses a
    # temp file + `--mcp-config`, cursor merges ~/.cursor/mcp.json + `--approve-mcps`,
    # opencode merges the global opencode.json `mcp` block, and codex merges
    # ~/.codex/config.toml [mcp_servers.*] tables. Agent-level `mcps:` (see agents
    # below) override these by name.
    mcps:
      - name: gitnexus
        command: npx
        args: ["-y", "gitnexus@latest", "mcp"]
        # env:                       # optional; ${VAR} refs are expanded at load
        #   GITNEXUS_TOKEN: ${GITNEXUS_TOKEN}

  # Cursor agent CLI — requires the `agent` binary from https://cursor.com/install.
  # The preset runs it headlessly (`-p --output-format stream-json --force`) and
  # passes the prompt positionally; no config needed.
  - id: cursor-cli
    type: cli
    provider: cursor

  # OpenCode CLI — invokes the local `opencode` binary (`opencode run …` with the
  # prompt as a positional argument). The binary authenticates as whatever account
  # is logged in; Apiary never handles credentials for CLI runners.
  - id: opencode-cli
    type: cli
    provider: opencode
    # All `config` keys are optional — the provider preset covers them. Available
    # keys: command (binary override), args, model_flag, prompt_flag,
    # prompt_positional, turns_flag. See docs/runners.md#cli-engine-configuration.
    # config:
    #   command: /usr/local/bin/opencode

  # Codex CLI — invokes the local `codex` binary as `codex exec --sandbox
  # workspace-write …` with the prompt as a positional argument. Codex discovers
  # repo skills from `.agents/skills`.
  - id: codex-cli
    type: cli
    provider: codex

  # OpenCode API — calls the OpenCode HTTP API directly (OpenAI-compatible
  # chat completions). Requires an API key.
  - id: opencode-api
    type: opencode-api
    config:
      api_key: ${OPENCODE_API_KEY}
      # base_url: https://api.opencode.ai/v1   # optional; /chat/completions appended
      # endpoint: https://...                  # full URL override (wins over base_url)
    models:
      - opencode-go/deepseek-v4-pro
      - opencode-go/minimax-m3

# Default runner used by agents if not overridden
default_runner: claude-cli

# ── Sources ────────────────────────────────────────────────────────────────────
sources:
  - id: project-erp
    type: plane
    config:
      workspace: project-erp
      project: 6ee18c57-7f88-414c-bad5-44ef4afd979b
      api_key: ${PLANE_API_KEY}
      base_url: http://localhost:8091
    poll_interval: 60s
    filters:
      states: [backlog, todo, in progress]

  - id: my-repo
    type: github
    config:
      repo: my-org/my-repo
      # GitHub personal access token. Required for private repos.
      #
      # Classic PAT: scope `repo` (full control).
      # Fine-grained PAT: `Issues` → Read & Write, `Metadata` → Read.
      #
      # Without a token: 60 req/h (public repos only).
      api_key: ${GITHUB_TOKEN}
      # base_url: https://api.github.com  # optional for GHES
    poll_interval: 120s
    filters:
      states: [open]
      labels: [ai-ready]

  - id: my-jira
    type: jira
    config:
      # Jira Cloud site URL (Server/Data Center is not supported).
      base_url: https://yoursite.atlassian.net
      # Atlassian account email + API token (Basic auth).
      # Create a token at https://id.atlassian.com/manage-profile/security/api-tokens
      email: bot@example.com
      api_token: ${JIRA_API_TOKEN}
      # Optional project key (or list of keys) to scope polling.
      project: ERP            # or: project: [ERP, OPS]
      # Optional status Acknowledge transitions issues to on dispatch.
      # Without it, the first transition into Jira's "In Progress" category is used.
      started_state: In Progress
    poll_interval: 120s
    filters:
      # Primary filter: any JQL clause, ANDed into every poll.
      jql: 'labels = apiary AND statusCategory != Done'
      # Secondary client-side filters (status / label names).
      states: [to do, in progress]
      labels: [apiary]

  - id: prod-alerts
    type: prometheus
    config:
      # Alertmanager base URL — /api/v2/alerts is polled (dedup/silences/
      # inhibitions already applied). Read-only source: alerts have no state,
      # labels, or comments to write back; publish findings to a ticket source.
      alertmanager_url: https://alertmanager.internal:9093
      # bearer_token: ${ALERTMANAGER_TOKEN}   # optional auth
      # Alert-storm cap: at most this many not-yet-seen alerts become tasks
      # per poll (oldest first); overflow surfaces on later polls. 0 = off.
      max_new_per_poll: 10
      # Flap dampener: alerts must have been firing at least this long.
      min_age: 1m
    poll_interval: 30s
    filters:
      # Alertmanager matchers, ANDed server-side. key=value, key:value, or a
      # raw matcher like env=~"prod|staging".
      labels: ["severity=critical", "team=platform"]

  - id: prod-problems
    type: dynatrace
    config:
      # Environment URL — SaaS ({env-id}.live.dynatrace.com) or Managed
      # (https://host/e/{env-id}). /api/v2/problems is polled (Davis has
      # already correlated root cause + impacted entities into one problem).
      # Read-only source: problems have no state, labels, or comments to
      # write back; publish findings to a ticket source.
      base_url: https://abc12345.live.dynatrace.com
      # Access token with the problems.read scope.
      api_token: ${DYNATRACE_API_TOKEN}
      # Problem-storm cap: at most this many not-yet-seen problems become
      # tasks per poll (oldest first); overflow surfaces on later polls. 0 = off.
      max_new_per_poll: 10
      # Flap dampener: problems must have been open at least this long.
      min_age: 1m
      # How far back the from= window reaches (the API defaults to 2h, which
      # would hide older still-open problems).
      lookback: 720h
    poll_interval: 30s
    filters:
      # problemSelector criteria, ANDed server-side. severity=/impact=/
      # managementZone= map to selector functions; other key=value pairs
      # match entity tags; raw criteria like displayId("P-123") pass through.
      labels: ["severity=availability", "managementZone=Prod"]

  # Plugin-bridged source: polls an out-of-process `source`-capability plugin
  # (declared under plugins: below) on the normal poll interval. Read-only
  # like the monitoring sources; see docs/plugins.md#source-plugins.
  # - id: custom-items
  #   type: plugin
  #   poll_interval: 30s
  #   config:
  #     plugin: dev.apiary.source-file   # id of the enabled plugin instance
  #   filters:
  #     labels: ["severity=critical"]    # forwarded to the plugin's poll

# Out-of-process plugins (docs/plugins.md). A `source`-capability plugin can
# back a `type: plugin` source (see the commented custom-items source above).
# plugins:
#   - id: dev.apiary.source-file
#     timeout: 5s
#     config:
#       path: .apiary/incoming-items.json

# ── Agents ─────────────────────────────────────────────────────────────────────
agents:
  # === Claude-based agents (original design) ===

  - id: investigator
    description: "Investigator — analyzes and classifies tasks by complexity"
    soul_file: .apiary/souls/investigator.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, changelog-contexto]

  - id: po
    description: "Product Owner — transforms business demands into specifications"
    soul_file: .apiary/souls/po.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, changelog-contexto, delegate-to-agent]

  - id: staff
    description: "Staff Engineer — designs complex solutions and decomposes tasks"
    soul_file: .apiary/souls/staff.md
    runner: claude-cli
    model: claude-opus-4-8
    skills: [gitnexus-codebase, git-workflow, changelog-contexto]

  - id: engineer
    description: "Engineer — implements tasks following project conventions"
    soul_file: .apiary/souls/engineer.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [git-workflow, e2e-before-pr, gitnexus-codebase, handler-error-logging, changelog-contexto]
    # Rate-limit failover chain: if claude-cli is rejected by the 5h session
    # limit, retry on these runners (in order) until one isn't rate-limited.
    # `runner` must be defined above; `model` is optional (omitted = its default).
    fallbacks:
      - {runner: opencode-cli, model: opencode-go/deepseek-v4-pro}
      - {runner: cursor-cli}
    # Agent-scope MCP servers are layered over the runner's `mcps:` (override by
    # name, new names appended). Use this to give one agent an extra tool.
    # mcps:
    #   - name: playwright
    #     command: npx
    #     args: ["-y", "@playwright/mcp@latest"]

  - id: reviewer
    description: "Reviewer — performs code review and quality checks"
    soul_file: .apiary/souls/reviewer.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [git-workflow, gitnexus-codebase, e2e-before-pr]
    # Per-agent source token and git identity. When set, write operations
    # (comments, labels, state changes) use this GitHub account, and commits
    # use these author details — each agent acts as its own identity.
    source_token: ${GITHUB_TOKEN_REVIEWER}
    source_email: reviewer@company.com
    source_name: Reviewer Bot
    # Agent-scope env: applied to every step that runs this agent, in any
    # workflow. Lowest-precedence explicit scope (workflow.env and step.env
    # override it), layered above the identity overlay (git + source_token).
    env:
      REVIEW_PROFILE: strict

  - id: qa
    description: "QA — validates implementation against acceptance criteria"
    soul_file: .apiary/souls/qa.md
    runner: claude-cli
    model: claude-sonnet-4-6
    skills: [e2e-before-pr, changelog-contexto]
    source_token: ${GITHUB_TOKEN_QA}
    source_email: qa@company.com

  # === OpenCode-based agents ===
  - id: agent-opencode-cli
    description: "OpenCode — runs tasks via the opencode CLI"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-cli
    model: opencode-go/deepseek-v4-flash
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-opencode-api
    description: "OpenCode — runs tasks via the OpenCode API"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-api
    model: opencode-go/deepseek-v4-pro
    skills: [git-workflow, gitnexus-codebase]

# ── Workflows ──────────────────────────────────────────────────────────────────
# Single-agent workflows (formerly `routes:`) — each matches on the agent: label.
workflows:
  - id: complex-design
    trigger:
      priority: 10
      match:
        source: project-erp
        labels: [agent:staff]
    steps:
      - id: run
        agent: staff
    on_complete:
      set_state: in review

  - id: requirements-spec
    trigger:
      priority: 15
      match:
        source: project-erp
        labels: [agent:po]
    steps:
      - id: run
        agent: po
    on_complete:
      set_state: in review

  - id: engineer-implement
    trigger:
      priority: 20
      match:
        source: project-erp
        labels: [agent:engineer]
    steps:
      - id: run
        agent: engineer
    on_complete:
      set_state: in review

  - id: code-review
    trigger:
      priority: 25
      match:
        source: project-erp
        labels: [agent:reviewer]
    # Workflow-scope env: applied to every step of this workflow. Overrides
    # agent.env; overridden by step.env. Precedence: STEP > WORKFLOW > AGENT.
    env:
      REVIEW_PROFILE: relaxed
      CI_TARGET: staging
    steps:
      - id: run
        agent: reviewer
        # Step-scope env: highest-precedence explicit scope. CI_TARGET here wins
        # over the workflow value; REVIEW_PROFILE falls back to the workflow's.
        env:
          CI_TARGET: production
    on_complete:
      set_state: in review

  - id: qa-validate
    trigger:
      priority: 30
      match:
        source: project-erp
        labels: [agent:qa]
    steps:
      - id: run
        agent: qa
    on_complete:
      set_state: done

  # Triage — classify a new issue and route it to the right agent in one instance.
  - id: triage
    description: "Classify a new issue and route it to the right agent in one instance."
    resume: allowed
    trigger:
      priority: 100
      match:
        source: project-erp
        states: [todo]
        exclude_label_prefix: "agent:"

    steps:
      - id: classify
        agent: investigator
        summary_prompt: "One line: which agent you chose and the key reason."
        output_schema:
          type: object
          properties:
            agent: {type: string, enum: [po, staff, engineer, reviewer, qa]}
          required: [agent]
        memory:
          write: [agent]

      - id: route
        type: split
        branches:
          - if: 'memory.agent == "po"'
            goto: spec
          - if: 'memory.agent == "staff"'
            goto: design
          - if: 'memory.agent == "reviewer"'
            goto: review
          - if: 'memory.agent == "qa"'
            goto: validate
          - else: true
            goto: implement

      - id: spec
        agent: po
        prompt: "Produce the spec / acceptance criteria for this issue."

      - id: design
        agent: staff
        prompt: "Design the solution and decompose it into smaller tasks."

      - id: implement
        agent: engineer
        prompt: "Implement the change following project conventions."

      - id: review
        agent: reviewer
        prompt: "Review the change for correctness and conventions."

      - id: validate
        agent: qa
        prompt: "Validate the implementation against its acceptance criteria."

    on_complete:
      set_state: done
    on_fail:
      add_labels: [needs-attention]

  # ── Internal fan-out & agent-driven write-back (internal-task-model) ──────────
  # `exclusive: true` — when this trigger matches, the router stops evaluating
  # lower-priority triggers, so an incident does NOT also fan out to the agent:*
  # workflows above; it is claimed by this workflow alone. (With exclusive: false,
  # the default, a task fans out to EVERY matching workflow, each as its own
  # instance, and the top-level `tasks:` hook below fires once all of them finish.)
  #
  # `once: true` — run this workflow at most once per task. Once it has a completed
  # (done) instance for the task, later polls do NOT re-dispatch it even if the task
  # still matches the trigger. Essential for a fan-out / decomposition workflow whose
  # source item stays in its trigger set after it succeeds (e.g. it spawns children
  # but does not change its own labels/state): without `once`, every poll would
  # re-dispatch and create a DUPLICATE set of children (issue #119). Failed runs are
  # not blocked — they stay eligible for retry up to settings.max_attempts.
  - id: incident-triage
    description: "Triage an incident, write a summary back to the issue, and spawn a collection task."
    trigger:
      priority: 5
      exclusive: true
      once: true
      match:
        source: project-erp
        labels: [incident]
    steps:
      - id: triage
        agent: investigator
        prompt: |
          Assess the incident. Then write a short human-facing summary back to the
          issue and spawn a follow-up task to collect diagnostics, by emitting:

          APIARY_PUBLISH_BEGIN
          <one-paragraph summary posted as a comment on the source item>
          APIARY_PUBLISH_END

          APIARY_SPAWN_BEGIN
          {"workflow": "collect-logs", "title": "Collect logs for incident", "input": {"severity": "high"}, "key": "incident/collect-logs"}
          APIARY_SPAWN_END
        publish: auto   # write the APIARY_PUBLISH payload back to the task's source bindings
        spawn: await    # block until the spawned collect-logs task is terminal; its failure fails this step
        # "key" is OPTIONAL and makes spawning idempotent per parent task: re-running
        # this step (or this whole workflow) with the same key resolves to the child
        # already created instead of fanning out a duplicate. Use a stable per-task key
        # (e.g. "<spec>/<task>") when one spec decomposes into a fixed set of sub-tasks,
        # so a re-decomposition can never produce two of the same. When "key" is omitted
        # the spawner derives one from (workflow, title, input), so byte-identical spawns
        # still dedup; supply an explicit key whenever the title/input may vary across runs.
    on_complete:
      set_state: in review

  # Named child workflow dispatched at runtime by the APIARY_SPAWN marker above. It
  # has no trigger — it runs against a binding-less InternalTask whose parent is the
  # spawning task, started BY NAME rather than by routing.
  - id: collect-logs
    description: "Collect diagnostic logs for an incident (spawned via APIARY_SPAWN)."
    steps:
      - id: collect
        agent: investigator
        prompt: "Gather the relevant logs and metrics for the incident described in the task input."

  # ── Decomposition into sub-issues (materialize) ──────────────────────────────
  # A spec/PO workflow that fans an issue out into several sub-issues — the right
  # tool when a downstream agent should pick each piece up as its own GitHub issue
  # (rather than running inline as a spawned child workflow, like collect-logs).
  #
  # `materialize: sub_issue` makes each APIARY_SPAWN entry into a real GitHub issue
  # under the parent, EXACTLY ONCE. Two guards make it idempotent so a re-run never
  # duplicates the set (issue #119): the spawn `key` (one child per key per parent)
  # and the source-binding unique constraint (one sub-issue per child). Combined with
  # `once: true`, even the agent does not re-run after success.
  #
  # The spawn entries here are "materialize-only": they carry NO `workflow` field, so
  # no inline workflow runs. The created sub-issues carry agent:* labels, so the
  # normal poll→route loop dispatches the right implementer on the next cycle — the
  # same path a human-filed issue takes.
  - id: spec-decompose
    description: "Turn a spec issue into a deduplicated set of implementer sub-issues."
    trigger:
      priority: 15
      once: true
      match:
        source: project-erp
        labels: [agent:po]
    steps:
      - id: spec
        agent: po
        materialize: sub_issue   # publish each spawned child as a GitHub sub-issue, exactly once
        prompt: |
          Decompose this issue into implementer sub-tasks. Emit ONE APIARY_SPAWN
          block whose body is a JSON array — one object per sub-task, each with a
          stable `key` (so a re-run dedups), `labels` (the implementer), and a `body`
          (the spec). Do not include a `workflow` field.

          APIARY_SPAWN_BEGIN
          [
            {"title": "Add customer CRUD endpoints", "body": "GIVEN ... THEN ...", "labels": ["agent:backend"], "key": "customer-crud-endpoint"},
            {"title": "Customer list screen", "body": "GIVEN ... THEN ...", "labels": ["agent:frontend"], "key": "customer-list-screen"}
          ]
          APIARY_SPAWN_END
        # materialize: sub_issue is incompatible with spawn: await (a materialized
        # child runs no inline workflow to await) — config lint rejects the pair.
    on_complete:
      set_state: closed


# ── Settings ───────────────────────────────────────────────────────────────────
settings:
  concurrency: 2
  log_level: info
  state_lock: true
  # Stop re-dispatching a (task, workflow) after this many consecutive failed
  # instances (rate-limited runs fail over and don't count). <=0 disables.
  max_attempts: 3
  # Log rotation: rotate apiary.log past this size (MB), keep this many
  # rotated backups, and prune backups + per-task logs + SQLite log rows
  # older than this many days. Negative values disable each behaviour.
  log_max_size_mb: 50
  log_max_backups: 5
  log_max_age_days: 30
  # Persistent agent memory (opt-in): agents save durable facts and per-task
  # working notes via the APIARY_MEMORIZE marker, stored as markdown under
  # <data-dir>/memory (next to apiary.db). The MEMORY.md index plus the task's
  # notes are injected into every step prompt (budget-capped); agents read full
  # entries from $APIARY_MEMORY_DIR. Curate with `apiary memory list|show|rm|prune`.
  memory:
    enabled: false
    # path: /custom/memory/root      # default: <data-dir>/memory
    # max_inject_chars: 4000         # prompt budget for the recall sections
    # max_entry_bytes: 16384         # cap on a single memorized fact
    # task_retention: 720h           # prune task notes this long after the task ends
  # Cursor cost back-fill (opt-in): the Cursor agent CLI streams token counts
  # but no dollar cost, so cursor-cli runs record $0.00. On usage-based Cursor
  # plans the daemon can recover real billed amounts from the cursor.com
  # dashboard API and back-fill cost_usd on finished executions. Needs the
  # WorkosCursorSessionToken browser cookie (valid ~60 days) in .env.
  cursor_cost:
    enabled: false
    # session_token: ${CURSOR_SESSION_TOKEN}  # default: CURSOR_SESSION_TOKEN env var
    # interval: 5m                   # sweep cadence
    # max_age: 72h                   # how far back to back-fill
    # team_id: 0                     # REQUIRED for team-billed accounts (authInfo.teamId in ~/.cursor/cli-config.json)
    # user_id: 0                     # filter to your own events on team accounts (authInfo.userId)
  # Git hook enforcement (opt-in): at startup the daemon points core.hooksPath
  # of every repo matched by `repos` at `dir`, so e.g. a pre-push hook running
  # the project's local lint/tests physically blocks agents from pushing
  # untested code — soul-file rules alone are advisory. Scripts in `dir` are
  # made executable automatically; non-git matches are skipped.
  # git_hooks:
  #   dir: .apiary/hooks
  #   repos:
  #     - ../myproject--*            # the agents' per-role checkouts

# ── Task completion hook (internal-task-model) ───────────────────────────────────
# Fires once per InternalTask, when the LAST of its fanned-out workflows reaches a
# terminal state: on_complete when all succeeded, on_fail when any failed. Applies
# to every source binding on the task. (Per-workflow on_complete/on_fail above fire
# once per workflow instance; this fires once per task.)
tasks:
  on_complete:
    add_labels: [ai-complete]
  on_fail:
    set_state: blocked
    add_labels: [ai-failed]

# ── Escalation notifications (#201) ──────────────────────────────────────────────
# Whenever a hook (a workflow's on_fail/on_complete, the task-level hooks above,
# or the failure-cap park) adds one of `on_labels` to a source item, every channel
# fires — so a flow parked with needs-attention pings a human instead of freezing
# silently. Only `type: command` exists: an arbitrary shell hook (ntfy, Slack
# webhook via curl, osascript, ...) so apiary carries no provider integrations.
# Placeholders {{task_id}} {{cell_id}} {{number}} {{title}} {{url}} {{label}}
# {{summary}} are substituted shell-quoted; the same values are exported as
# APIARY_TASK_ID, APIARY_CELL_ID, APIARY_NUMBER, APIARY_TITLE, APIARY_URL,
# APIARY_LABEL, APIARY_SUMMARY.
# notifications:
#   on_labels: [needs-attention]
#   channels:
#     - type: command
#       run: curl -s -d "{{number}} escalated ({{label}}): {{summary}}" ntfy.sh/my-apiary-alerts
