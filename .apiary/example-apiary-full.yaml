version: "1"

# ── Runners ────────────────────────────────────────────────────────────────────
# Define how agents will execute (CLI, API, custom gateway, etc.)
runners:
  # Claude CLI runner (local development, no API keys needed)
  - id: claude-cli
    type: cli
    config:
      command: claude
      model_flag: --model
      prompt_flag: -p
      args: ["--output-format", "stream-json", "--verbose"]

  # Claude API runner (Anthropic API with full model access)
  - id: claude-api
    type: api
    config:
      provider: anthropic
      base_url: https://api.anthropic.com/v1
      api_key: ${ANTHROPIC_API_KEY}
      # Optional: model name mappings if needed
      # models:
      #   claude-opus-4-8: claude-4-20250514
      #   claude-sonnet-4-6: claude-3-5-sonnet-20241022

  # ── OpenCode runners ────────────────────────────────────────────────────────
  # OpenCode has two subscription tiers (Go and Zen), each available in two
  # execution modes (CLI and API). Choose the combination that fits your setup.
  #
  #   CLI mode:   invokes the opencode binary as a subprocess.
  #               Requires opencode installed on the host.
  #
  #   API mode:   calls the opencode HTTP API directly.
  #               Requires an API key from the respective subscription.
  #
  # ── Script runner ────────────────────────────────────────────────────────────
  # Executes arbitrary shell commands. Injects APIARY_CELL_* env vars.
  #   - id: my-script
  #     type: script
  #     config:
  #       command: /bin/sh

  # OpenCode Go — CLI mode (uses the local opencode binary with Go subscription)
  - id: opencode-go-cli
    type: cli
    provider: opencode
    config:
      mode: cli
      subscription: go
      binary: opencode
      agent: backend-dev
      model_flag: --model
      prompt_flag: --prompt
      turns_flag: --max-turns
      agent_flag: --agent

  # OpenCode Go — API mode (calls the Go API directly)
  - id: opencode-go-api
    type: api
    provider: opencode
    config:
      mode: api
      subscription: go
      api_key: ${OPENCODE_GO_API_KEY}

  # OpenCode Zen — CLI mode (uses the local opencode binary with Zen subscription)
  - id: opencode-zen-cli
    type: cli
    provider: opencode
    config:
      mode: cli
      subscription: zen
      binary: opencode
      agent: backend-dev
      model_flag: --model
      prompt_flag: --prompt
      turns_flag: --max-turns
      agent_flag: --agent

  # OpenCode Zen — API mode (calls the Zen API directly)
  - id: opencode-zen-api
    type: api
    provider: opencode
    config:
      mode: api
      subscription: zen
      api_key: ${OPENCODE_ZEN_API_KEY}

# Default runner used by agents if not overridden
default_runner: claude-cli

# ── Sources ────────────────────────────────────────────────────────────────────
sources:
  - id: project-erp
    type: plane
    config:
      workspace: project-erp
      project: 6ee18c57-7f88-414c-bad5-44ef4afd979b
      api_key: ${PLANE_API_KEY}
      base_url: http://localhost:8091
    poll_interval: 60s
    filters:
      states: [backlog, todo, in progress]

  - id: my-repo
    type: github
    config:
      repo: my-org/my-repo
      # GitHub personal access token. Required for private repos.
      #
      # Classic PAT: scope `repo` (full control).
      # Fine-grained PAT: `Issues` → Read & Write, `Metadata` → Read.
      #
      # Without a token: 60 req/h (public repos only).
      api_key: ${GITHUB_TOKEN}
      # base_url: https://api.github.com  # optional for GHES
    poll_interval: 120s
    filters:
      states: [open]
      labels: [ai-ready]

# ── Agents ─────────────────────────────────────────────────────────────────────
agents:
  # === Claude-based agents (original design) ===

  - id: investigator
    description: "Investigator — analyzes and classifies tasks by complexity"
    soul_file: .apiary/souls/investigator.md
    runner: claude-cli
    preferred_models: [claude-opus-4-8, claude-sonnet-4-6]
    skills: [gitnexus-codebase, changelog-contexto]

  - id: po
    description: "Product Owner — transforms business demands into specifications"
    soul_file: .apiary/souls/po.md
    runner: claude-cli
    preferred_models: [claude-opus-4-8]
    skills: [gitnexus-codebase, changelog-contexto, delegate-to-agent]

  - id: staff
    description: "Staff Engineer — designs complex solutions and decomposes tasks"
    soul_file: .apiary/souls/staff.md
    runner: claude-cli
    preferred_models: [claude-opus-4-8]
    skills: [gitnexus-codebase, git-workflow, changelog-contexto]

  - id: engineer
    description: "Engineer — implements tasks following project conventions"
    soul_file: .apiary/souls/engineer.md
    runner: claude-cli
    preferred_models: [claude-sonnet-4-6, claude-haiku-4-5]
    skills: [git-workflow, e2e-before-pr, gitnexus-codebase, handler-error-logging, changelog-contexto]

  - id: reviewer
    description: "Reviewer — performs code review and quality checks"
    soul_file: .apiary/souls/reviewer.md
    runner: claude-cli
    preferred_models: [claude-sonnet-4-6]
    skills: [git-workflow, gitnexus-codebase, e2e-before-pr]

  - id: qa
    description: "QA — validates implementation against acceptance criteria"
    soul_file: .apiary/souls/qa.md
    runner: claude-cli
    preferred_models: [claude-sonnet-4-6, claude-haiku-4-5]
    skills: [e2e-before-pr, changelog-contexto]

  # === OpenCode-based agents ===
  - id: agent-go-cli
    description: "OpenCode Go — runs tasks via the opencode CLI"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-go-cli
    preferred_models: [opencode-go/deepseek-v4-flash, opencode-go/kimi-k2.5]
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-go-api
    description: "OpenCode Go — runs tasks via the Go API"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-go-api
    preferred_models: [opencode-go/deepseek-v4-pro, opencode-go/minimax-m3]
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-zen-cli
    description: "OpenCode Zen — runs tasks via the opencode CLI"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-zen-cli
    preferred_models: [opencode/gpt-5.5, opencode/claude-sonnet-4-6]
    skills: [git-workflow, gitnexus-codebase]

  - id: agent-zen-api
    description: "OpenCode Zen — runs tasks via the Zen API"
    soul_file: .apiary/souls/engineer.md
    runner: opencode-zen-api
    preferred_models: [opencode/gpt-5.4, opencode/claude-opus-4.8]
    skills: [git-workflow, gitnexus-codebase]

# ── Routes ─────────────────────────────────────────────────────────────────────
routes:
  # === Claude-based agent routes ===
  # Specific agent:* routes are evaluated first (lower priority number wins).
  # The investigator is the LAST-RESORT fallback (see bottom) and only fires for
  # an unassigned TODO.

  # Complex issues → Staff for design analysis
  - id: complex-design
    priority: 10
    match:
      source: project-erp
      labels: [agent:staff]
    agent: staff
    on_complete:
      set_state: in review

  # Requirements → PO for specification
  - id: requirements-spec
    priority: 15
    match:
      source: project-erp
      labels: [agent:po]
    agent: po
    on_complete:
      set_state: in review

  # Implementation → Engineer
  - id: engineer-implement
    priority: 20
    match:
      source: project-erp
      labels: [agent:engineer]
    agent: engineer
    on_complete:
      set_state: in review

  # Code review → Reviewer
  - id: code-review
    priority: 25
    match:
      source: project-erp
      labels: [agent:reviewer]
    agent: reviewer
    on_complete:
      set_state: in review

  # Testing → QA
  - id: qa-validate
    priority: 30
    match:
      source: project-erp
      labels: [agent:qa]
    agent: qa
    on_complete:
      set_state: done

  # New issues → Investigator for classification.
  # Fallback: only UNASSIGNED issues still in TODO.
  # - exclude_label_prefix: "agent:" → skip anything already routed to an agent
  # - states: [todo]                 → only brand-new work
  # Highest priority number → evaluated last, after every agent:* route.
  - id: new-issue-classify
    priority: 100
    match:
      source: project-erp
      states: [todo]
      exclude_label_prefix: "agent:"
    agent: investigator
    on_complete:
      # Apiary parses `APIARY-ASSIGN: <agent>` from the investigator's output and
      # adds the `agent:<agent>` label. The task stays in Todo (no set_state), so
      # the chosen agent's route matches it on the next poll.
      assign_from_output: true


# ── Settings ───────────────────────────────────────────────────────────────────
settings:
  concurrency: 2
  log_level: info
  state_lock: true
  result_comment: true
