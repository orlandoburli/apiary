version: "1"

# ── Runners ────────────────────────────────────────────────────────────────────
runners:
  - id: codex
    type: cli
    provider: codex
    models:
      - gpt-5.5
    # Uses the same checked-in skills through .agents/skills -> ../.claude/skills.
    # GitNexus is exposed to Codex through ~/.codex/config.toml when this runner
    # is configured by Apiary.
    mcps:
      - name: gitnexus
        command: npx
        args: ["-y", "gitnexus@latest", "mcp"]

default_runner: codex

# ── Sources ────────────────────────────────────────────────────────────────────
sources:
  - id: project-erp
    type: github
    config:
      repo: orlandoburli-enterprise/project-erp
      # Token permissions:
      #   Classic PAT: scope `repo`
      #   Fine-grained: `Issues` → Read & Write, `Metadata` → Read
      api_key: ${GITHUB_TOKEN}
    poll_interval: 60s
    filters:
      states: [open]

# ── Agents ─────────────────────────────────────────────────────────────────────
agents:
  - id: investigator
    description: "Analyzes and classifies new issues by complexity"
    soul_file: .apiary/souls/investigator.md
    model: gpt-5.5
    max_workers: 2

  - id: po
    description: "Transforms business demands into specifications"
    soul_file: .apiary/souls/po.md
    model: gpt-5.5
    max_workers: 2

  - id: staff
    description: "Designs complex solutions and decomposes tasks"
    soul_file: .apiary/souls/staff.md
    model: gpt-5.5
    max_workers: 2

  - id: engineer
    description: "Implements tasks following project conventions"
    soul_file: .apiary/souls/engineer.md
    model: gpt-5.5
    max_workers: 2

  - id: backend
    description: "Implements backend tasks"
    soul_file: .apiary/souls/backend.md
    model: gpt-5.5
    max_workers: 2

  - id: frontend
    description: "Implements frontend tasks"
    soul_file: .apiary/souls/frontend.md
    model: gpt-5.5
    max_workers: 2

  - id: reviewer
    description: "Performs code review and quality checks"
    soul_file: .apiary/souls/reviewer.md
    model: gpt-5.5
    max_workers: 2

  - id: qa
    description: "Validates implementation against acceptance criteria"
    soul_file: .apiary/souls/qa.md
    model: gpt-5.5
    max_workers: 2

# ── Workflows ──────────────────────────────────────────────────────────────────
# Single-agent workflows (formerly `routes:`) — each matches on the agent: label.
workflows:
  - id: staff-design
    trigger:
      priority: 10
      match:
        source: project-erp
        labels: [agent:staff]
    steps:
      - id: run
        agent: staff
    on_complete:
      set_state: closed

  - id: po-spec
    trigger:
      priority: 15
      # once: the PO decomposition runs at most once per issue. After it has a
      # completed instance, later polls do not re-dispatch it — so a spec issue that
      # lingers in the trigger set (e.g. before on_complete closes it) never fans out
      # a second set of sub-issues. The spawn dedup key + the materialize binding
      # check already make sub-issue creation idempotent (issue #119); once: also
      # avoids re-running the (expensive) PO agent.
      once: true
      match:
        source: project-erp
        labels: [agent:po]
    steps:
      - id: run
        agent: po
        # materialize: each sub-task the PO emits via APIARY_SPAWN is published as a
        # GitHub sub-issue under this issue, exactly once. The new sub-issues carry
        # agent:* labels, so the normal poll→route loop dispatches the right
        # implementer. Re-running the PO resolves to the same children (by spawn key)
        # and never duplicates them.
        materialize: sub_issue
    on_complete:
      set_state: closed

  - id: backend-implement
    trigger:
      priority: 20
      match:
        source: project-erp
        labels: [agent:backend]
    steps:
      - id: run
        agent: backend
    on_complete:
      set_state: closed

  - id: frontend-implement
    trigger:
      priority: 21
      match:
        source: project-erp
        labels: [agent:frontend]
    steps:
      - id: run
        agent: frontend
    on_complete:
      set_state: closed

  - id: engineer-implement
    trigger:
      priority: 22
      match:
        source: project-erp
        labels: [agent:engineer]
    steps:
      - id: run
        agent: engineer
    on_complete:
      set_state: closed

  - id: code-review
    trigger:
      priority: 25
      match:
        source: project-erp
        labels: [agent:reviewer]
    steps:
      - id: run
        agent: reviewer
    on_complete:
      set_state: closed

  - id: qa-validate
    trigger:
      priority: 30
      match:
        source: project-erp
        labels: [agent:qa]
    steps:
      - id: run
        agent: qa
    on_complete:
      set_state: closed

  # Triage — classify a new issue and route it to the right agent in one instance.
  - id: triage
    description: "Classify a new issue and route it to the right agent in one instance."
    resume: allowed
    trigger:
      priority: 100
      match:
        source: project-erp
        exclude_label_prefix: "agent:"
        # Skip work-in-progress issues. Add the `draft` label to keep apiary from
        # auto-triaging an issue; remove it when the issue is ready to be picked up.
        exclude_labels: [draft]

    steps:
      # 1) Classify. The investigator emits a structured `agent` decision, which
      #    we persist into workflow memory for the split to read.
      - id: classify
        agent: investigator
        summary_prompt: "One line: which agent you chose and the key reason."
        output_schema:
          type: object
          properties:
            agent: {type: string, enum: [po, staff, engineer, reviewer, qa]}
          required: [agent]
        memory:
          write: [agent]

      # 2) Route on the classified agent. `engineer` is the fallback (the common
      #    case, and a safe default if classification is missing/unparseable).
      - id: route
        type: split
        branches:
          - if: 'memory.agent == "po"'
            goto: spec
          - if: 'memory.agent == "staff"'
            goto: design
          - if: 'memory.agent == "reviewer"'
            goto: review
          - if: 'memory.agent == "qa"'
            goto: validate
          - else: true
            goto: implement

      # 3) Exactly one of these runs — whichever the split activates.
      - id: spec
        agent: po
        prompt: "Produce the spec / acceptance criteria for this issue."
        # Same as po-spec: sub-tasks the PO emits via APIARY_SPAWN are published as
        # GitHub sub-issues exactly once, deduped by spawn key. The whole triage
        # workflow runs once per issue (on_complete closes it), so the decomposition
        # is not repeated.
        materialize: sub_issue

      - id: design
        agent: staff
        prompt: "Design the solution and decompose it into smaller tasks."

      - id: implement
        agent: engineer
        prompt: "Implement the change following project conventions."

      - id: review
        agent: reviewer
        prompt: "Review the change for correctness and conventions."

      - id: validate
        agent: qa
        prompt: "Validate the implementation against its acceptance criteria."

    on_complete:
      set_state: closed
    on_fail:
      add_labels: [needs-attention]

# ── Settings ───────────────────────────────────────────────────────────────────
settings:
  concurrency: 2
  log_level: info
  state_lock: true
  result_comment: true
