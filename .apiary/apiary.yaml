version: "1"

# Apiary working on Apiary.
#
# This is the operator config for dogfooding: the daemon polls this repo's own
# issues and dispatches agents to implement them. Run it from the repo root:
#
#   apiary daemon --config .apiary/apiary.yaml
#
# Opt-in by design. Apiary is a public repo, so nothing is picked up until you
# add the `apiary:auto` label to an issue — an outside issue can never drive an
# agent (or spend tokens) on its own. Add the label to opt a specific issue in;
# `agent:<id>` labels bypass triage and go straight to that agent.

# ── Runners ────────────────────────────────────────────────────────────────────
runners:
  - id: codex
    type: cli
    provider: codex
    models:
      - gpt-5.5
    # Codex reads repository skills from .agents/skills, symlinked to
    # ../.claude/skills, so agents get the same checked-in skills a local
    # session has (git-workflow, gitnexus-codebase, e2e-before-pr, …).
    mcps:
      - name: gitnexus
        command: npx
        args: ["-y", "gitnexus@latest", "mcp"]

  # Available as a fallback / alternative. Since v0.13.0 the claude-cli preset
  # bypasses the permission prompt by default (#370); narrow it here with
  # permission_mode/allowed_tools if you want a tighter posture.
  - id: claude
    type: cli
    provider: claude
    models:
      - claude-opus-5
    mcps:
      - name: gitnexus
        command: npx
        args: ["-y", "gitnexus@latest", "mcp"]

default_runner: codex

# ── Sources ────────────────────────────────────────────────────────────────────
sources:
  - id: apiary
    type: github
    config:
      repo: orlandoburli/apiary
      # Token permissions:
      #   Classic PAT: scope `repo`
      #   Fine-grained: `Issues` → Read & Write, `Contents` → Read & Write,
      #                 `Pull requests` → Read & Write, `Metadata` → Read
      api_key: ${GITHUB_TOKEN}
    poll_interval: 60s
    filters:
      states: [open]

# ── Agents ─────────────────────────────────────────────────────────────────────
# Roster is deliberately Go-shaped: no backend/frontend split, because this repo
# is a Go CLI + TUI plus a mkdocs site and a VS Code extension.
agents:
  - id: investigator
    description: "Classifies an apiary issue and picks the agent that should own it"
    soul_file: .apiary/souls/investigator.md
    model: gpt-5.5
    max_workers: 1

  - id: staff
    description: "Designs non-trivial changes and decomposes them into sub-issues"
    soul_file: .apiary/souls/staff.md
    model: gpt-5.5
    max_workers: 1

  - id: engineer
    description: "Implements Go changes in src/ following the repo's conventions"
    soul_file: .apiary/souls/engineer.md
    model: gpt-5.5
    max_workers: 2

  - id: docs
    description: "Writes and fixes the mkdocs site under docs/"
    soul_file: .apiary/souls/docs.md
    model: gpt-5.5
    max_workers: 1

  - id: reviewer
    description: "Reviews an open PR for correctness and repo conventions"
    soul_file: .apiary/souls/reviewer.md
    model: gpt-5.5
    max_workers: 1

  - id: qa
    description: "Validates a change against its acceptance criteria"
    soul_file: .apiary/souls/qa.md
    model: gpt-5.5
    max_workers: 1

# ── Workflows ──────────────────────────────────────────────────────────────────
workflows:
  # Direct assignment: `agent:<id>` sends an issue straight to that agent,
  # skipping triage. The label is removed on completion so a re-opened issue
  # does not loop.
  - id: staff-design
    trigger:
      priority: 10
      match:
        source: apiary
        labels: [agent:staff]
    steps:
      - id: run
        agent: staff
        # Sub-tasks emitted via APIARY_SPAWN become GitHub sub-issues exactly
        # once (deduped by spawn key, #119). They carry agent:* labels, so the
        # normal poll→route loop dispatches the right implementer.
        materialize: sub_issue
    on_complete:
      remove_labels: [agent:staff]

  - id: engineer-implement
    trigger:
      priority: 20
      match:
        source: apiary
        labels: [agent:engineer]
    steps:
      - id: run
        agent: engineer
    on_complete:
      remove_labels: [agent:engineer]

  - id: docs-write
    trigger:
      priority: 21
      match:
        source: apiary
        labels: [agent:docs]
    steps:
      - id: run
        agent: docs
    on_complete:
      remove_labels: [agent:docs]

  - id: code-review
    trigger:
      priority: 25
      match:
        source: apiary
        labels: [agent:reviewer]
    steps:
      - id: run
        agent: reviewer
    on_complete:
      remove_labels: [agent:reviewer]

  - id: qa-validate
    trigger:
      priority: 30
      match:
        source: apiary
        labels: [agent:qa]
    steps:
      - id: run
        agent: qa
    on_complete:
      remove_labels: [agent:qa]

  # Triage — classify an opted-in issue and route it in a single instance.
  #
  # The `apiary:auto` label is the opt-in gate: this is a public repo, so
  # triage must never fire on an issue just because a stranger opened it.
  # `once: true` plus removing the label on completion keeps a long-lived issue
  # from being re-triaged on every poll.
  - id: triage
    description: "Classify an opted-in issue and route it to the right agent."
    resume: allowed
    trigger:
      priority: 100
      once: true
      match:
        source: apiary
        labels: [apiary:auto]
        # An issue already assigned to an agent skips triage.
        exclude_label_prefix: "agent:"
        # `draft` parks an issue: apiary leaves it alone until you remove it.
        exclude_labels: [draft]

    steps:
      # 1) Classify. The investigator emits a structured `agent` decision,
      #    persisted into workflow memory for the split to read.
      - id: classify
        agent: investigator
        summary_prompt: "One line: which agent you chose and the key reason."
        output_schema:
          type: object
          properties:
            agent: {type: string, enum: [staff, engineer, docs, reviewer, qa]}
          required: [agent]
        memory:
          write: [agent]

      # 2) Route on the classified agent. `engineer` is the fallback — the
      #    common case, and a safe default if classification is unparseable.
      - id: route
        type: split
        branches:
          - if: 'memory.agent == "staff"'
            goto: design
          - if: 'memory.agent == "docs"'
            goto: document
          - if: 'memory.agent == "reviewer"'
            goto: review
          - if: 'memory.agent == "qa"'
            goto: validate
          - else: true
            goto: implement

      # 3) Exactly one of these runs — whichever the split activates.
      - id: design
        agent: staff
        prompt: "Design the change and decompose it into smaller sub-issues."
        materialize: sub_issue

      - id: implement
        agent: engineer
        prompt: "Implement the change following the repo's conventions, and open a PR."

      - id: document
        agent: docs
        prompt: "Write or correct the documentation this issue asks for, and open a PR."

      - id: review
        agent: reviewer
        prompt: "Review the referenced PR for correctness and repo conventions."

      - id: validate
        agent: qa
        prompt: "Validate the implementation against its acceptance criteria."

    # The issue is NOT auto-closed: on this repo a change lands through a PR, and
    # the PR merge closes its issue. Triage only drops the opt-in label so the
    # issue stops matching, and flags failures for a human.
    on_complete:
      remove_labels: [apiary:auto]
    on_fail:
      add_labels: [needs-attention]
      remove_labels: [apiary:auto]

# ── Settings ───────────────────────────────────────────────────────────────────
settings:
  # Deliberately small. Agents here push branches and open PRs against a public
  # repo; a low ceiling keeps a misbehaving run from producing a pile of them.
  concurrency: 2
  log_level: info
  state_lock: true
