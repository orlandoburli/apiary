name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - DEVELOPMENT.md
      - docs/**
      - mkdocs.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Copy root docs into docs/
        run: |
          cp README.md docs/index.md
          cp DEVELOPMENT.md docs/development.md
          cp LICENSE docs/LICENSE  # served as /LICENSE
          # Fix relative paths from root-level docs
          # Strip the docs/ prefix from all markdown links so they resolve on the site
          sed -i 's|](docs/|](|g' docs/index.md
          sed -i 's|DEVELOPMENT.md|development.md|g' docs/index.md
          sed -i 's|docs/logo.svg|logo.svg|g' docs/index.md
          sed -i 's|docs/screenshots/|screenshots/|g' docs/index.md
          sed -i 's|openspec/specs/visao-geral/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/visao-geral/spec.md|g' docs/index.md
          sed -i 's|openspec/specs/arquitetura/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/arquitetura/spec.md|g' docs/index.md
          sed -i 's|openspec/specs/schema/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/schema/spec.md|g' docs/index.md
          sed -i 's|openspec/specs/plugin-api/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/plugin-api/spec.md|g' docs/index.md
          sed -i 's|openspec/specs/cli/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/cli/spec.md|g' docs/index.md
          sed -i 's|openspec/specs/roadmap/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/roadmap/spec.md|g' docs/index.md
          sed -i 's|COMMERCIAL.md|https://github.com/orlandoburli/apiary/blob/main/COMMERCIAL.md|g' docs/index.md
          sed -i 's|\([^!]\)(openspec/|\1(https://github.com/orlandoburli/apiary/tree/main/openspec/|g' docs/index.md
          sed -i 's|openspec/specs/plugin-api/spec.md|https://github.com/orlandoburli/apiary/blob/main/openspec/specs/plugin-api/spec.md|g' docs/development.md
          # LICENSE link: README uses (LICENSE) which should resolve to /LICENSE on the site
          sed -i 's|](LICENSE)|](/LICENSE)|g' docs/index.md

      - name: Stamp latest release version into docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rewrite any pinned-version example (e.g. ghcr.io/orlandoburli/apiary:0.3.0)
          # to the latest published release, so the site never shows a stale version.
          # The markdown keeps a real version so it also reads fine on GitHub.
          LATEST=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name | sed 's/^v//') || true
          if [ -n "$LATEST" ]; then
            echo "latest release: $LATEST"
            find docs -name '*.md' -exec \
              sed -i -E "s|(ghcr\.io/orlandoburli/apiary:)[0-9]+\.[0-9]+\.[0-9]+|\1${LATEST}|g" {} +
          else
            echo "could not resolve latest release — keeping versions as committed"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install mkdocs
        run: pip install mkdocs-material

      - name: Build site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
