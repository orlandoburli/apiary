name: release-check

# Validates the release pipeline on PRs without publishing anything:
# lints .goreleaser.yaml and builds all artifacts in snapshot mode.
on:
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - "Dockerfile"
      - ".github/workflows/release*.yml"
      - "src/go.mod"
      - "src/go.sum"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # snapshot builds the Docker images (no push) — needs QEMU + buildx
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          # snapshot skips upload, but the brews/scoops token template is still
          # resolved — give it a dummy so the build doesn't fail on a missing env.
          TAP_GITHUB_TOKEN: dummy-snapshot-token
