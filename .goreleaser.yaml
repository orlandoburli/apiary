# GoReleaser config — Apiary binary distribution
# Phase 1: cross-platform archives + checksums on each `v*` tag.
# Phase 2: nfpms (deb/rpm). Phase 3: multi-arch Docker images on ghcr.io.
# Later phases add brews, scoops, winget, aurs.
# Docs: https://goreleaser.com
version: 2

project_name: apiary

before:
  hooks:
    - sh -c "cd src && go mod tidy"

builds:
  - id: apiary
    dir: src # the Go module lives under src/ (mirrors the Makefile)
    main: ./cmd/apiary
    binary: apiary
    env:
      - CGO_ENABLED=0 # pure-Go SQLite (modernc.org/sqlite) — static cross-compile
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # keep in sync with the Makefile's version injection
      - -s -w
      - -X github.com/orlandoburli/apiary/internal/version.Version={{ .Version }}

archives:
  - id: apiary
    ids: [apiary]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: apiary
    ids: [apiary]
    package_name: apiary
    vendor: Orlando Burli
    homepage: "https://github.com/orlandoburli/apiary"
    maintainer: Orlando Burli <orlando.developermaster@gmail.com>
    description: Task-driven agent orchestration harness (GitHub Issues, Plane, and other sources).
    license: AGPL-3.0
    formats: [deb, rpm]
    bindir: /usr/bin

# Multi-arch images. Each `dockers` entry builds one arch from the prebuilt
# static binary; `docker_manifests` stitches them into a single multi-arch tag.
dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/orlandoburli/apiary"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/orlandoburli/apiary"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0"

docker_manifests:
  - name_template: "ghcr.io/orlandoburli/apiary:{{ .Version }}"
    image_templates:
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-amd64"
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-arm64"
  - name_template: "ghcr.io/orlandoburli/apiary:latest"
    skip_push: auto # don't move :latest on prereleases / snapshots
    image_templates:
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-amd64"
      - "ghcr.io/orlandoburli/apiary:{{ .Version }}-arm64"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: orlandoburli
    name: apiary
  draft: false
  prerelease: auto # tags like v0.1.0-rc1 are marked pre-release automatically
