# GoReleaser config — Apiary binary distribution
# Phase 1: cross-platform archives + checksums on each `v*` tag.
# Phase 2: nfpms (deb/rpm). Phase 3: multi-arch Docker images on ghcr.io.
# Later phases add brews, scoops, winget, aurs.
# Docs: https://goreleaser.com
version: 2

project_name: apiary

git:
  # Kept for changelog/previous-tag selection only. NOTE: this does NOT stop
  # `git describe` from picking an `sdk/vX.Y.Z` tag as the *current* tag —
  # verified against goreleaser 2.16.0, where every pattern form was a no-op.
  # The snapshot build pins GORELEASER_CURRENT_TAG instead; see
  # .github/workflows/release-check.yml.
  ignore_tags:
    - "sdk/*"

before:
  hooks:
    - sh -c "cd src && go mod tidy"

builds:
  - id: apiary
    dir: src # the Go module lives under src/ (mirrors the Makefile)
    main: ./cmd/apiary
    binary: apiary
    env:
      - CGO_ENABLED=0 # pure-Go SQLite (modernc.org/sqlite) — static cross-compile
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      # keep in sync with the Makefile's version injection
      - -s -w
      - -X github.com/orlandoburli/apiary/internal/version.Version={{ .Version }}
      # The plugin registry's minisign public key. Released binaries verify the
      # official index against it; an empty value (no APIARY_REGISTRY_PUBLIC_KEY
      # in the release environment) means registry commands report the index as
      # unverified rather than silently trusting it.
      - -X github.com/orlandoburli/apiary/internal/plugin.OfficialRegistryPublicKey={{ if index .Env "APIARY_REGISTRY_PUBLIC_KEY" }}{{ .Env.APIARY_REGISTRY_PUBLIC_KEY }}{{ end }}

archives:
  - id: apiary
    ids: [apiary]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: apiary
    ids: [apiary]
    package_name: apiary
    vendor: Orlando Burli
    homepage: "https://github.com/orlandoburli/apiary"
    maintainer: Orlando Burli <orlando.developermaster@gmail.com>
    description: Task-driven agent orchestration harness (GitHub Issues, Plane, and other sources).
    license: BSD-3-Clause
    formats: [deb, rpm]
    bindir: /usr/bin

# Multi-arch images. `dockers_v2` replaces the deprecated `dockers` +
# `docker_manifests` pair: one `docker buildx build --push` produces both the
# per-platform images and the multi-arch manifest, so the separate manifest
# stitching step is gone (#535).
#
# The binary is NOT built here — goreleaser already built it for every target
# platform. The Dockerfile copies it from the build context, which lays the
# artifacts out under $TARGETPLATFORM/ (see the Dockerfile's ARG TARGETPLATFORM).
dockers_v2:
  - id: apiary
    dockerfile: Dockerfile
    ids:
      - apiary
    images:
      - "ghcr.io/orlandoburli/apiary"
    tags:
      - "{{ .Version }}"
      # Don't move :latest on prereleases / snapshots, the way the old
      # `skip_push: auto` manifest did.
      - "{{ if not .IsSnapshot }}{{ if not .IsNightly }}latest{{ end }}{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.source": "https://github.com/orlandoburli/apiary"
      "org.opencontainers.image.licenses": "BSD-3-Clause"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: orlandoburli
    name: apiary
  draft: false
  prerelease: auto # tags like v0.1.0-rc1 are marked pre-release automatically

# Homebrew (macOS + Linux). Pushes a cask to orlandoburli/homebrew-tap →
#   brew install --cask orlandoburli/tap/apiary
# (homebrew_casks replaces the deprecated `brews`/formula path for prebuilt
# binaries.) Needs TAP_GITHUB_TOKEN (a PAT with contents:write on the tap repo);
# the default GITHUB_TOKEN can't push to other repos.
homebrew_casks:
  - name: apiary
    ids: [apiary]
    repository:
      owner: orlandoburli
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/orlandoburli/apiary"
    description: "Task-driven agent orchestration harness (GitHub Issues, Plane, and other sources)."
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    skip_upload: auto # don't publish casks for prereleases / snapshots
    # Unsigned binary: strip the Gatekeeper quarantine flag on install so macOS
    # doesn't block it. (Proper notarization is a deferred follow-up.)
    #
    # `hooks.post.install` was deprecated in goreleaser v2.19: Homebrew replaced
    # the `preflight` stanza with `preflight_steps`, whose declarative DSL uses
    # `run` instead of `system_command` and `{{ .StagedPath }}` instead of
    # `#{staged_path}` (#535).
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/apiary"]
          end

# Scoop (Windows). Pushes a manifest to orlandoburli/scoop-bucket →
#   scoop bucket add orlandoburli https://github.com/orlandoburli/scoop-bucket
#   scoop install apiary
scoops:
  - name: apiary
    ids: [apiary]
    repository:
      owner: orlandoburli
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/orlandoburli/apiary"
    description: "Task-driven agent orchestration harness (GitHub Issues, Plane, and other sources)."
    license: "BSD-3-Clause"
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@users.noreply.github.com
    skip_upload: auto # don't publish manifests for prereleases / snapshots
